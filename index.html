<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossiê: Justice League Unlimited</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Modais -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-modal">
        <h2>⚡ JUSTIÇA UNLIMITED ⚡</h2>
        <input type="text" id="loginUser" placeholder="NOME DO HERÓI (USUÁRIO)">
        <input type="password" id="loginPass" placeholder="SENHA">
        <button onclick="doLogin()">ENTRAR</button>
        <button onclick="showRegister()">CRIAR CONTA</button>
        <div id="loginError" style="color:#ff4444; text-align:center; margin-top:10px;"></div>
        <div id="serverStatus" style="text-align:center; margin-top:10px; font-size:0.8rem;"></div>
    </div>
</div>

<div id="registerOverlay" class="login-overlay" style="display: none;">
    <div class="login-modal">
        <h2>📝 CRIAR CONTA</h2>
        <input type="text" id="regUser" placeholder="NOME DO HERÓI (USUÁRIO)">
        <input type="password" id="regPass" placeholder="SENHA">
        <input type="password" id="regConfirm" placeholder="CONFIRMAR SENHA">
        <button onclick="doRegister()">REGISTRAR</button>
        <button onclick="showLogin()">VOLTAR</button>
        <div id="regError" style="color:#ff4444; text-align:center; margin-top:10px;"></div>
    </div>
</div>

<div id="charSelectOverlay" class="character-select" style="display: none;">
    <div class="character-modal">
        <h2>🎭 SELECIONE SEU HERÓI</h2>
        <div id="characterList" style="max-height:300px; overflow-y:auto; margin-bottom:20px;"></div>
        <button onclick="createNewCharacter()">+ NOVO HERÓI</button>
        <button onclick="showImportModal()" style="background:#2a6b2a;">📥 IMPORTAR CÓDIGO</button>
        <button onclick="logout()" style="background:#4a0000; margin-top:10px;">🚪 SAIR</button>
    </div>
</div>

<!-- Barra PAX -->
<div class="pax-bar">
    <div class="bar-left">
        <div class="pax-info"><span class="pax-label">RANK</span> <span id="rankDisplay" class="pax-value">D</span></div>
        <div class="pax-info"><span class="pax-label">PAX</span> <span id="paxSpentDisplay" class="pax-value">0</span> <span style="color:#666;">/</span> <span id="paxMaxDisplay" class="pax-value">40</span><span id="paxStatus" class="pax-status"></span></div>
    </div>
    <div class="bar-right">
        <div class="pax-info"><span class="pax-label">ROTEIRO</span><div class="roteiro-ctrl"><button class="roteiro-btn" onclick="changeRoteiro(-1)">-</button><span id="roteiroVal" class="roteiro-val">0</span><button class="roteiro-btn" onclick="changeRoteiro(1)">+</button></div></div>
        <button id="crisisBtn" class="crisis-btn" onclick="toggleCrisis()">⚠️ CRISE</button>
        <div id="userInfo" class="user-info" style="display:none;">
            <span id="userNameDisplay"></span>
            <span id="connectionStatus" class="status-online"></span>
            <button onclick="showCharacterSelect()" style="background:none; color:#f2ce16;">📁</button>
            <button onclick="saveCurrentToServer()" style="background:none; color:#00ff00;">💾</button>
            <button onclick="showShareModal()" style="background:none; color:#f2ce16;">🔗</button>
        </div>
    </div>
</div>

<div class="dossier-container" id="dossierContainer" style="display: none;">
    <header>
        <div><div class="subtitle">JUSTICE LEAGUE UNLIMITED</div><h1>DOSSIÊ DO HERÓI</h1></div>
        <div><label>NÍVEL DE AMEAÇA</label><div class="tier-selector"><div class="tier-btn active" onclick="setTier(this,'D')">D</div><div class="tier-btn" onclick="setTier(this,'C')">C</div><div class="tier-btn" onclick="setTier(this,'B')">B</div><div class="tier-btn" onclick="setTier(this,'A')">A</div><div class="tier-btn" onclick="setTier(this,'S')">S</div></div><input type="hidden" id="tierValue" value="D"></div>
    </header>
    <div class="grid-3">
        <div class="input-group"><label>IDENTIDADE CIVIL</label><input type="text" id="civilID"></div>
        <div class="input-group"><label>NOME DE HERÓI</label><input type="text" id="heroName" style="color:#f2ce16; font-weight:bold;"></div>
        <div class="input-group"><label>MENTOR / GRUPO</label><input type="text" id="mentor"></div>
    </div>
    <div class="grid-3">
        <div class="input-group"><label>ORIGEM</label><select id="origin"><option value="">-- SELECIONE --</option><option value="Humano">Humano</option><option value="Kryptoniano">Kryptoniano</option><option value="Atlante">Atlante</option><option value="Marciano">Marciano</option><option value="Velocista">Velocista</option></select></div>
        <div class="input-group"><label>ARQUÉTIPO</label><select id="archetype"><option value="">-- SELECIONE --</option><option value="Campeão do Amanhã">Campeão do Amanhã</option><option value="Cavaleiro das Trevas">Cavaleiro das Trevas</option></select></div>
        <div class="input-group"><label>JOGADOR</label><input type="text" id="player"></div>
    </div>
    <h2>O CÍRCULO DOURADO</h2>
    <div class="grid-3">
        <div><label>POR QUE LUTA?</label><div class="editable-box" contenteditable="true" id="motiv_why"></div></div>
        <div><label>COMO LUTA?</label><div class="editable-box" contenteditable="true" id="motiv_how"></div></div>
        <div><label>POR QUEM LUTA?</label><div class="editable-box" contenteditable="true" id="motiv_whom"></div></div>
    </div>
    <h2>ATRIBUTOS</h2>
    <div class="grid-6">
        <div class="stat-box"><label>POTÊNCIA</label><div class="stat-split"><div><input type="number" id="pot_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="pot_bonus" class="attr-bonus" value="0"></div></div><span id="pot_total" class="stat-total">0</span></div>
        <div class="stat-box"><label>PRECISÃO</label><div class="stat-split"><div><input type="number" id="prec_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="prec_bonus" class="attr-bonus" value="0"></div></div><span id="prec_total" class="stat-total">0</span></div>
        <div class="stat-box"><label>AGILIDADE</label><div class="stat-split"><div><input type="number" id="agi_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="agi_bonus" class="attr-bonus" value="0"></div></div><span id="agi_total" class="stat-total">0</span></div>
        <div class="stat-box"><label>RESISTÊNCIA</label><div class="stat-split"><div><input type="number" id="res_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="res_bonus" class="attr-bonus" value="0"></div></div><span id="res_total" class="stat-total">0</span></div>
        <div class="stat-box"><label>MENTE</label><div class="stat-split"><div><input type="number" id="men_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="men_bonus" class="attr-bonus" value="0"></div></div><span id="men_total" class="stat-total">0</span></div>
        <div class="stat-box"><label>ESPÍRITO</label><div class="stat-split"><div><input type="number" id="esp_base" class="attr-base" value="0" step="3"></div><div><input type="number" id="esp_bonus" class="attr-bonus" value="0"></div></div><span id="esp_total" class="stat-total">0</span></div>
    </div>
    <h2>PODERES</h2>
    <div id="powers-container"></div>
    <h2>STATUS</h2>
    <div class="grid-2">
        <div><label>DETERMINAÇÃO</label><input type="number" id="det" readonly></div>
        <div><label>DEFESA</label><input type="number" id="def" readonly></div>
        <div><label>INICIATIVA</label><input type="number" id="init" readonly></div>
        <div><label>CONDIÇÕES</label><div><button class="condition-btn" onclick="toggleCond(this)">CANSADO</button><button class="condition-btn" onclick="toggleCond(this)">FERIDO</button><button class="condition-btn" onclick="toggleCond(this)">GRAVE</button></div></div>
    </div>
    <h2>INVENTÁRIO</h2>
    <div class="editable-box" contenteditable="true" id="inventory"></div>
    <h2>ANOTAÇÕES</h2>
    <div class="editable-box" contenteditable="true" id="notes"></div>
</div>

<div class="action-bar">
    <button class="fab-btn" onclick="saveSheet()">💾</button>
    <button class="fab-btn" onclick="window.print()">🖨️</button>
</div>

<script>
// ==================== CONFIGURAÇÃO ====================
// ⚠️ ALTERE ESTA URL PARA A URL DO SEU BACKEND ⚠️
const API_URL = 'https://ficha-rpg-2-0.onrender.com';

let currentUser = null;
let currentCharacter = null;

// Verificar conexão com o servidor
async function checkServerConnection() {
    const statusDiv = document.getElementById('serverStatus');
    const connectionSpan = document.getElementById('connectionStatus');
    
    try {
        // Tenta acessar a raiz do servidor
        const response = await fetch(API_URL.replace('/api', '/'), {
            method: 'GET',
            mode: 'cors'
        });
        
        if (response.ok) {
            statusDiv.innerHTML = '✅ Servidor conectado';
            statusDiv.style.color = '#00ff9d';
            if (connectionSpan) connectionSpan.className = 'status-online';
            console.log('✅ Servidor online');
        } else {
            throw new Error('Servidor não respondeu');
        }
    } catch (error) {
        statusDiv.innerHTML = '⚠️ Servidor offline - Verifique se o backend está rodando';
        statusDiv.style.color = '#ff4444';
        if (connectionSpan) connectionSpan.className = 'status-offline';
        console.error('❌ Erro de conexão:', error);
    }
}

// API Request com timeout
async function apiRequest(endpoint, method, data = null) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    
    const options = {
        method,
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        mode: 'cors'
    };
    if (data) options.body = JSON.stringify(data);
    
    try {
        const response = await fetch(`${API_URL}${endpoint}`, options);
        clearTimeout(timeoutId);
        
        if (!response.ok) {
            let errorMsg = `Erro ${response.status}`;
            try {
                const errorData = await response.json();
                errorMsg = errorData.error || errorMsg;
            } catch(e) {}
            throw new Error(errorMsg);
        }
        return await response.json();
    } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
            throw new Error('Timeout - Servidor não respondeu');
        }
        throw error;
    }
}

// ==================== AUTH ====================
async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    
    if (!username || !password) {
        document.getElementById('loginError').innerText = 'Preencha todos os campos!';
        return;
    }
    
    document.getElementById('loginError').innerText = 'Conectando...';
    
    try {
        const result = await apiRequest('/auth', 'POST', { username, password, action: 'login' });
        currentUser = username;
        document.getElementById('loginOverlay').style.display = 'none';
        await loadCharacters();
        showCharacterSelect();
    } catch (error) {
        document.getElementById('loginError').innerText = error.message;
        console.error('Login error:', error);
    }
}

async function doRegister() {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const confirm = document.getElementById('regConfirm').value;
    
    if (!username || !password) {
        document.getElementById('regError').innerText = 'Preencha todos os campos!';
        return;
    }
    
    if (password !== confirm) {
        document.getElementById('regError').innerText = 'Senhas não conferem!';
        return;
    }
    
    document.getElementById('regError').innerText = 'Criando conta...';
    
    try {
        await apiRequest('/auth', 'POST', { username, password, action: 'register' });
        document.getElementById('regError').style.color = '#00ff9d';
        document.getElementById('regError').innerText = '✅ Conta criada! Faça login.';
        setTimeout(() => showLogin(), 1500);
    } catch (error) {
        document.getElementById('regError').style.color = '#ff4444';
        document.getElementById('regError').innerText = error.message;
    }
}

function showRegister() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('registerOverlay').style.display = 'flex';
}

function showLogin() {
    document.getElementById('registerOverlay').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
}

function logout() {
    currentUser = null;
    currentCharacter = null;
    document.getElementById('charSelectOverlay').style.display = 'none';
    document.getElementById('dossierContainer').style.display = 'none';
    document.getElementById('userInfo').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
}

// ==================== PERSONAGENS ====================
async function loadCharacters() {
    try {
        return await apiRequest(`/characters/${currentUser}`, 'GET');
    } catch (error) {
        console.error('Erro ao carregar personagens:', error);
        return {};
    }
}

async function saveCharacter(charId, charData) {
    return await apiRequest(`/character/${currentUser}/${charId}`, 'POST', charData);
}

async function deleteCharacterFromServer(charId) {
    return await apiRequest(`/character/${currentUser}/${charId}`, 'DELETE');
}

async function showCharacterSelect() {
    const characters = await loadCharacters();
    const container = document.getElementById('characterList');
    container.innerHTML = '';
    
    if (Object.keys(characters).length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">Nenhum herói criado...</div>';
    } else {
        for (const [id, data] of Object.entries(characters)) {
            const div = document.createElement('div');
            div.className = 'character-item';
            div.innerHTML = `
                <div><div class="character-name">${data.heroName || 'Herói'}</div><div style="font-size:0.8rem;">Tier ${data.tier || 'D'}</div></div>
                <div>
                    <button onclick="loadCharacter('${id}')" style="background:#2a6b2a; margin-right:5px; padding:5px 10px; border:none; border-radius:3px; cursor:pointer;">▶</button>
                    <button onclick="deleteCharacter('${id}')" style="background:#4a0000; margin-right:5px; padding:5px 10px; border:none; border-radius:3px; cursor:pointer;">🗑</button>
                    <button onclick="shareExistingCharacter('${id}')" style="background:#f2ce16; color:#000; padding:5px 10px; border:none; border-radius:3px; cursor:pointer;">🔗</button>
                </div>
            `;
            container.appendChild(div);
        }
    }
    
    document.getElementById('userNameDisplay').innerText = currentUser;
    document.getElementById('charSelectOverlay').style.display = 'flex';
}

async function createNewCharacter() {
    const newId = 'char_' + Date.now();
    const newChar = {
        heroName: 'Novo Herói',
        tier: 'D',
        origin: '', archetype: '', civilID: '', mentor: '', player: '',
        motiv_why: '', motiv_how: '', motiv_whom: '',
        pot_base: 0, pot_bonus: 0, prec_base: 0, prec_bonus: 0,
        agi_base: 0, agi_bonus: 0, res_base: 0, res_bonus: 0,
        men_base: 0, men_bonus: 0, esp_base: 0, esp_bonus: 0,
        roteiro: 0, crisis: false, conditions: [],
        powers: [], equips: [], knowledges: [], traits: [],
        inventory: '', notes: ''
    };
    await saveCharacter(newId, newChar);
    await loadCharacter(newId);
}

async function loadCharacter(charId) {
    try {
        const charData = await apiRequest(`/character/${currentUser}/${charId}`, 'GET');
        if (!charData) return;
        
        currentCharacter = charId;
        
        document.getElementById('heroName').value = charData.heroName || '';
        document.getElementById('civilID').value = charData.civilID || '';
        document.getElementById('mentor').value = charData.mentor || '';
        document.getElementById('player').value = charData.player || '';
        document.getElementById('origin').value = charData.origin || '';
        document.getElementById('archetype').value = charData.archetype || '';
        
        document.getElementById('motiv_why').innerHTML = charData.motiv_why || '';
        document.getElementById('motiv_how').innerHTML = charData.motiv_how || '';
        document.getElementById('motiv_whom').innerHTML = charData.motiv_whom || '';
        
        document.getElementById('pot_base').value = charData.pot_base || 0;
        document.getElementById('pot_bonus').value = charData.pot_bonus || 0;
        document.getElementById('prec_base').value = charData.prec_base || 0;
        document.getElementById('prec_bonus').value = charData.prec_bonus || 0;
        document.getElementById('agi_base').value = charData.agi_base || 0;
        document.getElementById('agi_bonus').value = charData.agi_bonus || 0;
        document.getElementById('res_base').value = charData.res_base || 0;
        document.getElementById('res_bonus').value = charData.res_bonus || 0;
        document.getElementById('men_base').value = charData.men_base || 0;
        document.getElementById('men_bonus').value = charData.men_bonus || 0;
        document.getElementById('esp_base').value = charData.esp_base || 0;
        document.getElementById('esp_bonus').value = charData.esp_bonus || 0;
        
        document.getElementById('roteiroVal').innerText = charData.roteiro || 0;
        document.getElementById('inventory').innerHTML = charData.inventory || '';
        document.getElementById('notes').innerHTML = charData.notes || '';
        
        const tier = charData.tier || 'D';
        const tierBtns = document.querySelectorAll('.tier-btn');
        const tierIndex = { 'D': 0, 'C': 1, 'B': 2, 'A': 3, 'S': 4 }[tier];
        if (tierBtns[tierIndex]) setTier(tierBtns[tierIndex], tier);
        
        document.getElementById('charSelectOverlay').style.display = 'none';
        document.getElementById('dossierContainer').style.display = 'block';
        document.getElementById('userInfo').style.display = 'flex';
        
        calcStats();
    } catch (error) {
        alert('Erro ao carregar personagem: ' + error.message);
    }
}

async function saveCurrentToServer() {
    if (!currentUser || !currentCharacter) return;
    
    const sheetData = {
        heroName: document.getElementById('heroName').value,
        civilID: document.getElementById('civilID').value,
        mentor: document.getElementById('mentor').value,
        player: document.getElementById('player').value,
        origin: document.getElementById('origin').value,
        archetype: document.getElementById('archetype').value,
        motiv_why: document.getElementById('motiv_why').innerHTML,
        motiv_how: document.getElementById('motiv_how').innerHTML,
        motiv_whom: document.getElementById('motiv_whom').innerHTML,
        pot_base: document.getElementById('pot_base').value,
        pot_bonus: document.getElementById('pot_bonus').value,
        prec_base: document.getElementById('prec_base').value,
        prec_bonus: document.getElementById('prec_bonus').value,
        agi_base: document.getElementById('agi_base').value,
        agi_bonus: document.getElementById('agi_bonus').value,
        res_base: document.getElementById('res_base').value,
        res_bonus: document.getElementById('res_bonus').value,
        men_base: document.getElementById('men_base').value,
        men_bonus: document.getElementById('men_bonus').value,
        esp_base: document.getElementById('esp_base').value,
        esp_bonus: document.getElementById('esp_bonus').value,
        tier: document.getElementById('tierValue').value,
        roteiro: document.getElementById('roteiroVal').innerText,
        crisis: document.getElementById('crisisBtn').classList.contains('active'),
        conditions: [],
        inventory: document.getElementById('inventory').innerHTML,
        notes: document.getElementById('notes').innerHTML,
        powers: [], equips: [], knowledges: [], traits: []
    };
    
    try {
        await saveCharacter(currentCharacter, sheetData);
        alert('✅ Personagem salvo com sucesso!');
    } catch (error) {
        alert('❌ Erro ao salvar: ' + error.message);
    }
}

async function deleteCharacter(charId) {
    if (confirm('Tem certeza que deseja deletar este herói?')) {
        await deleteCharacterFromServer(charId);
        showCharacterSelect();
    }
}

// ==================== COMPARTILHAMENTO ====================
async function shareExistingCharacter(charId) {
    try {
        const charData = await apiRequest(`/character/${currentUser}/${charId}`, 'GET');
        const result = await apiRequest('/share', 'POST', { characterData: charData });
        alert(`🔗 Código: ${result.shareCode}\n\nCompartilhe com seus amigos!`);
        navigator.clipboard.writeText(result.shareCode);
    } catch (error) {
        alert('Erro ao compartilhar: ' + error.message);
    }
}

async function showShareModal() {
    if (!currentCharacter) return;
    await shareExistingCharacter(currentCharacter);
}

function showImportModal() {
    const code = prompt('Digite o código de compartilhamento:');
    if (code) importByCode(code);
}

async function importByCode(shareCode) {
    try {
        const charData = await apiRequest(`/share/${shareCode}`, 'GET');
        const newId = 'import_' + Date.now();
        await saveCharacter(newId, charData);
        alert('✅ Herói importado com sucesso!');
        showCharacterSelect();
    } catch (error) {
        alert('❌ Código inválido ou expirado!');
    }
}

// ==================== FUNÇÕES DA FICHA ====================
const TIERS_DATA = {
    'D': { det: 12, def: 8 }, 'C': { det: 15, def: 10 },
    'B': { det: 18, def: 12 }, 'A': { det: 21, def: 14 },
    'S': { det: 25, def: 16 }
};

function setTier(btn, tier) {
    document.querySelectorAll('.tier-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('rankDisplay').innerText = tier;
    document.getElementById('tierValue').value = tier;
    calcStats();
}

function toggleCond(btn) { btn.classList.toggle('active'); }
function changeRoteiro(delta) {
    let val = parseInt(document.getElementById('roteiroVal').innerText) || 0;
    val += delta;
    if (val < 0) val = 0;
    document.getElementById('roteiroVal').innerText = val;
}
function toggleCrisis() { document.getElementById('crisisBtn').classList.toggle('active'); }

function calcStats() {
    const tier = document.getElementById('tierValue').value;
    const tierData = TIERS_DATA[tier] || TIERS_DATA['D'];
    
    const esp = (parseInt(document.getElementById('esp_base').value)||0) + (parseInt(document.getElementById('esp_bonus').value)||0);
    const res = (parseInt(document.getElementById('res_base').value)||0) + (parseInt(document.getElementById('res_bonus').value)||0);
    const agi = (parseInt(document.getElementById('agi_base').value)||0) + (parseInt(document.getElementById('agi_bonus').value)||0);
    
    document.getElementById('det').value = tierData.det + esp;
    document.getElementById('def').value = tierData.def + res;
    document.getElementById('init').value = agi;
    
    document.querySelectorAll('.stat-box').forEach(box => {
        const base = parseInt(box.querySelector('.attr-base').value) || 0;
        const bonus = parseInt(box.querySelector('.attr-bonus').value) || 0;
        const total = base + bonus;
        box.querySelector('.stat-total').innerText = total > 0 ? '+' + total : total;
    });
}

function saveSheet() {
    saveCurrentToServer();
}

// Inicialização
window.onload = () => {
    checkServerConnection();
    setInterval(checkServerConnection, 30000);
    calcStats();
    
    document.querySelectorAll('.attr-base, .attr-bonus').forEach(el => {
        el.addEventListener('input', calcStats);
    });
};
</script>
</body>
</html>
